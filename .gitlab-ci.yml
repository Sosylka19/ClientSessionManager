stages:
  - build
  - test

variables:
  CXX: "g++"
  BUILD_DIR: "build"

before_script:
  - apt-get update -qq
  - apt-get install -y build-essential make pkg-config
  - apt-get install -y libboost-all-dev

build:
  stage: build
  tags:
    - local
  script:
    - make
  artifacts:
    paths:
      - serv
      - cl
    expire_in: 1 week

test:
  stage: test
  script:
    - make test